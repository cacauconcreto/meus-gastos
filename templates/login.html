<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Meus Gastos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-cadastro">

<div class="cadastro-container">

    <div class="cadastro-logo">
        <div class="logo-icon">$</div>
        <span>Meus Gastos</span>
    </div>

    <div class="cadastro-card">

        <div class="voltar"><a href="{{ url_for('inicio') }}">← Voltar</a></div>

        <div class="cadastro-header">
            <p class="pequeno">Bem-vindo de volta</p>
            <h1>Entrar</h1>
            <p>Acesse sua vida financeira.</p>
        </div>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="alert {{ categoria }}" role="alert">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="voce@email.com"
                       autocomplete="email" autofocus required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-principal btn-full">Entrar</button>
        </form>

        <p class="login-link">
            Ainda não possui uma conta?
            <a href="{{ url_for('cadastro') }}">Criar conta</a>
        </p>

    </div>
</div>

</body>
</html>
