<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mais — Meus Gastos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
<div class="app">

<header class="dashboard-topo">
    <div class="perfil">
        <div class="avatar">{{ usuario["nome"][0].upper() }}</div>
        <div>
            <span>Configurações</span>
            <strong>Mais</strong>
        </div>
    </div>
</header>

<main>

<div class="pagina-header">
    <span>Sua conta</span>
    <h1>Configurações</h1>
</div>

<section class="card menu-card">
    <div class="menu-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <div>
            <strong>{{ usuario["nome"] }}</strong>
            <small>{{ usuario["email"] }}</small>
        </div>
    </div>

    <div class="menu-item desativado">
        <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg>
        <div>
            <strong>Notificações</strong>
            <small>Lembretes e avisos</small>
        </div>
        <span class="tag-breve">Em breve</span>
    </div>

    <a href="{{ url_for('contas') }}" class="menu-item">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>
        <div><strong>Contas</strong><small>Carteira, bancos e saldos</small></div>
        <b aria-hidden="true">›</b>
    </a>

    <a href="{{ url_for('contas') }}#salario" class="menu-item">
        <svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 6.5C17 4.6 14.8 4 12 4S7 5 7 7.5 9.5 11 12 11.5s5 1.2 5 4S14.8 20 12 20s-5-.8-5-2.5"/></svg>
        <div><strong>Salário</strong><small>Receita automática todo mês</small></div>
        <b aria-hidden="true">›</b>
    </a>

    <a href="{{ url_for('logout') }}" class="menu-item">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        <div><strong class="sair">Sair da conta</strong></div>
        <b aria-hidden="true">›</b>
    </a>
</section>

</main>

{% include '_menu.html' %}

</div>
</body>
</html>
