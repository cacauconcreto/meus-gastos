<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#5224c9">
    <title>My Expenses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-boasvindas">

<main class="bv">

    <div class="bv-topo">
        <div class="bv-logo">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="My Expenses"
                 onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'$',className:'bv-fallback'}))">
        </div>
        <h1>My Expenses</h1>
        <p>Seu dinheiro, sob controle.</p>
    </div>

    <ul class="bv-itens">
        <li><span>📊</span> Veja para onde seu dinheiro vai</li>
        <li><span>🎯</span> Planeje o mês com limites</li>
        <li><span>🏷️</span> Organize por categorias</li>
    </ul>

    <div class="bv-acoes">
        <a href="{{ url_for('cadastro') }}" class="bv-btn bv-btn-branco">Criar conta</a>
        <a href="{{ url_for('login') }}" class="bv-btn bv-btn-vazado">Já tenho conta</a>
    </div>

</main>

</body>
</html>
