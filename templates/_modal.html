<div id="fab-fundo" class="fab-fundo" onclick="fecharFab()"></div>

<div id="fab-menu" class="fab-menu" hidden>
    <a href="{{ url_for('tela_nova', tipo='receita') }}" class="fab-item">
        Receita
        <span class="fab-circulo verde-txt"><svg viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></span>
    </a>
    <a href="{{ url_for('tela_nova', tipo='despesa') }}" class="fab-item">
        Despesa
        <span class="fab-circulo vermelho-txt"><svg viewBox="0 0 24 24"><path d="m3 7 6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg></span>
    </a>
    <a href="{{ url_for('tela_nova', tipo='transferencia') }}" class="fab-item">
        Transferência
        <span class="fab-circulo roxo-txt"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4"/><path d="M3 11V9a2 2 0 0 1 2-2h16"/><path d="M7 21l-4-4 4-4"/><path d="M21 13v2a2 2 0 0 1-2 2H3"/></svg></span>
    </a>
</div>

<button type="button" id="fab" class="botao-add" onclick="alternarFab()" aria-label="Adicionar" aria-expanded="false">+</button>

<script>
    const fab = document.getElementById("fab");
    const fabMenu = document.getElementById("fab-menu");
    const fabFundo = document.getElementById("fab-fundo");

    function alternarFab() {
        const abrir = fabMenu.hidden;
        fabMenu.hidden = !abrir;
        fabFundo.classList.toggle("aberto", abrir);
        fab.classList.toggle("aberto", abrir);
        fab.setAttribute("aria-expanded", abrir);
    }
    function fecharFab() { if (!fabMenu.hidden) alternarFab(); }
    document.addEventListener("keydown", e => { if (e.key === "Escape") fecharFab(); });
</script>
