<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta — Meus Gastos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-cadastro">

<div class="cadastro-container">

    <div class="cadastro-logo">
        <div class="logo-icon">$</div>
        <span>Meus Gastos</span>
    </div>

    <div class="cadastro-card">

        <div class="voltar"><a href="{{ url_for('inicio') }}">← Voltar</a></div>

        <div class="cadastro-header">
            <p class="pequeno">Comece agora</p>
            <h1>Crie sua conta</h1>
            <p>Organize seu dinheiro de um jeito simples.</p>
        </div>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="alert {{ categoria }}" role="alert">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome"
                       autocomplete="name" maxlength="80" autofocus required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="voce@email.com"
                       autocomplete="email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres"
                       autocomplete="new-password" minlength="6" required>
            </div>

            <div class="campo">
                <label for="confirmar_senha">Confirmar senha</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha"
                       placeholder="Digite a senha novamente"
                       autocomplete="new-password" minlength="6" required>
            </div>

            <button type="submit" class="btn-principal btn-full">Criar minha conta</button>
        </form>

        <p class="login-link">
            Já possui uma conta?
            <a href="{{ url_for('login') }}">Entrar</a>
        </p>

    </div>
</div>

</body>
</html>
