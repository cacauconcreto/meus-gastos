<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0820">
    <title>Criar conta — My Expenses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-auth">

<div class="auth-fundo" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="flutua f1"><i>↑</i> Salário <b>+ R$ 2.300</b></span>
    <span class="flutua f2"><i class="verm">↓</i> Mercado <b>− R$ 186</b></span>
    <span class="flutua f3"><i class="roxo">◎</i> Limite do mês <b>68%</b></span>
</div>

<main class="auth">
    <div class="auth-cartao">

        <div class="auth-logo">
            <div class="auth-logo-aro">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="My Expenses"
                     onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'$',className:'auth-logo-txt'}))">
            </div>
        </div>

        <h1 class="auth-titulo">Crie sua conta</h1>
        <p class="auth-sub">Leva menos de um minuto.</p>

        <nav class="auth-abas" aria-label="Entrar ou criar conta">
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('cadastro') }}" class="ativo" aria-current="page">Inscreva-se</a>
        </nav>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="auth-alerta {{ categoria }}" role="alert">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label class="auth-label" for="nome">Nome</label>
            <div class="auth-campo">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                <input type="text" id="nome" name="nome" placeholder="Seu nome"
                       autocomplete="name" maxlength="80" autofocus required>
            </div>

            <label class="auth-label" for="email">E-mail</label>
            <div class="auth-campo">
                <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 8 9 6 9-6"/></svg>
                <input type="email" id="email" name="email" placeholder="voce@email.com"
                       autocomplete="email" required>
            </div>

            <label class="auth-label" for="senha">Senha</label>
            <div class="auth-campo">
                <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres"
                       autocomplete="new-password" minlength="6" required>
                <button type="button" class="auth-olho" aria-label="Mostrar senha">
                    <svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <label class="auth-label" for="confirmar_senha">Confirmar senha</label>
            <div class="auth-campo">
                <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Repita a senha"
                       autocomplete="new-password" minlength="6" required>
            </div>

            <button type="submit" class="auth-btn">Criar minha conta</button>
        </form>

        <p class="auth-rodape">Já tem uma conta? <a href="{{ url_for('login') }}">Entrar</a></p>

    </div>
</main>

<script>
    document.querySelectorAll(".auth-olho").forEach(b => b.addEventListener("click", () => {
        const input = b.parentElement.querySelector("input");
        const mostrar = input.type === "password";
        input.type = mostrar ? "text" : "password";
        b.setAttribute("aria-label", mostrar ? "Ocultar senha" : "Mostrar senha");
    }));
</script>
</body>
</html>
